# dsh-left-sidebar-collapse bundle patch
#
# This file is the `dsh.bundle.patch` layer of the plugin's package.json
# (`dsh.bundle.patch`). When the plugin is installed through the official CLI
# —
#
#   dsh plugin --profile <name> add dsh-left-sidebar-collapse
#
# — `dsh plugin` reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends the plugin to the bundle stack. The
# profile boot then merges THIS patch (a single `insert` of the plugin row)
# exactly like a manual cordis.patch.yml mount line. No profile file edits are
# needed — one command installs and mounts the plugin.
- insert:
    - id: dsh-left-sidebar-collapse
      name: dsh-left-sidebar-collapse
